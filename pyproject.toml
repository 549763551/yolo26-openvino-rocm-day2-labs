[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo26-openvino-rocm-day2-labs"
version = "2.0.1"
description = "YOLO26 Day 02 - AI Inference Acceleration with OpenVINO & AMD ROCm (AMD CPU + Radeon PRO W7900)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "AIwork4me" }]
dependencies = [
    "ultralytics>=8.3.0",
    "openvino>=2024.4",
    "nncf>=2.13",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
lab = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[tool.setuptools]
packages = ["course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
